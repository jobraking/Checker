name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate DB config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          python3 - <<'PY'
          import json, os

          cfg = {
              "DB_DRIVER": "mysql",
              "DB_HOST": os.environ.get("DB_HOST", ""),
              "DB_PORT": os.environ.get("DB_PORT", "3306"),
              "DB_NAME": os.environ.get("DB_NAME", ""),
              "DB_USER": os.environ.get("DB_USER", ""),
              "DB_PASS": os.environ.get("DB_PASS", ""),
          }
          entries = ",\n".join(
              "    %s => %s" % (json.dumps(k), json.dumps(v))
              for k, v in cfg.items()
          )
          body = "<?php\ndeclare(strict_types=1);\n\nreturn [\n" + entries + ",\n];\n"
          with open("config.local.php", "w") as handle:
              handle.write(body)
          PY

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/htdocs/' }}
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/AGENTS.md
            **/reffarence/**
            reffarence/**
            **/pwd.json
            **/pwd
            **/.ck-session.json
            **/bulk-check-audit.jsonl
            **/db_name.txt
            **/solver.json
            **/proxy.txt
            **/data/**
